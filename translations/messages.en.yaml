info:
    title: 'Trip guide'
    eyebrow: 'Before you go'
    subtitle: 'Safety rules, what a day on the water looks like and answers to common questions.'
    meta_description: 'Safety on the river, how a kayaking trip works and answers to common questions: what to bring, whether kids can come, what to do if it rains.'
    safety:
        title: 'Safety rules'
        life_jacket:
            title: 'Life jacket — always!'
            text: 'Whatever your experience or swimming skills, always wear a life jacket. Unexpected flips happen to everyone.'
        sober:
            title: 'Celebrate once you’re back on shore'
            text: 'It’s much easier to handle challenges on the way and reach the finish when you’re sober.'
        not_alone:
            title: 'Never paddle alone'
            text: 'Keep the boat ahead of you in sight: if something unexpected happens, you can help each other or call for help.'
        oars:
            title: 'Paddles are for paddling'
            text: 'Pushing off the riverbed and banks with your paddle is almost useless — paddling is far more effective. Besides, paddles cost money.'
        trees:
            title: 'Hug a friend, not a tree'
            text: 'Most capsizes happen when paddlers grab at branches and the river disagrees.'
        posture:
            title: 'Keep your back straight'
            text: 'Your shoulders do the work. If you lean to the side with every stroke, something’s not right.'
    tips:
        title: 'More tips'
        dry_bag: 'Bring a waterproof case for your phone and documents'
        spare_clothes: 'Pack a change of clothes in a dry bag'
        sun: 'Protect yourself from the sun: sunscreen, a hat and sunglasses'
        instructor: 'Follow your instructor’s directions and stay with the group'
        enjoy: 'Enjoy the peace and beauty of Belarusian nature'
    process:
        title: 'How a trip works'
        step: 'Step %number%'
        1:
            title: 'Meeting and briefing'
            text: 'We meet at the agreed spot, get to know each other and give a thorough briefing. You receive all the gear you need for a safe trip.'
            points:
                1: 'Paddling technique lesson'
                2: 'Gear handout'
                3: 'Safety briefing'
        2:
            title: Launch
            text: 'We put the kayaks in the water, take our seats and the adventure begins. It may take a moment, but you’ll get the hang of it — you’ll see!'
            points:
                1: 'Launching the kayaks'
                2: 'Practising paddling technique'
                3: 'The first bushes round the first bend'
        3:
            title: 'On the river'
            text: 'We make our way down the river, enjoying nature and the quiet. We take photos, chat and relax, fully immersed in the adventure.'
            points:
                1: 'Tackling obstacles'
                2: 'Teamwork in the boat'
                3: 'Silence and views worth the journey'
        4:
            title: 'Break and rest'
            text: 'Halfway along the route we stop for a snack and a rest.'
            points:
                1: 'Relaxing on the bank'
                2: 'A snack and first impressions'
                3: 'A swim in a clean river'
        5:
            title: 'Finish and return'
            text: 'We reach the finish. Rest, food, a sauna and campfire games — on overnight programmes.'
            points:
                1: 'Arrival at the finish point'
                2: 'A sense of achievement'
                3: 'Songs around the campfire'
    promo:
        title: 'Ready for an adventure?'
        text: 'Book your trip now — no prepayment, we’ll call you back and sort everything out.'
    faq:
        title: FAQ
        1:
            question: 'Do I need any experience?'
            answer: 'No. Our instructors give a thorough briefing before the start and teach you everything you need. Most routes are suitable for beginners — all you need is enthusiasm and to follow the instructions.'
        2:
            question: 'What does the price include?'
            answer: 'The base price includes the hire of a kayak, paddles, life jackets and dry bags. Meals, tents, transfers, an instructor and camping kit depend on the package you choose — please check when booking.'
        3:
            question: 'Can I bring children?'
            answer: 'Yes, children can take part when accompanied by adults. We provide life jackets in the right sizes and can suggest the routes best suited to a family day out.'
        4:
            question: 'What if it rains?'
            answer: 'Light rain is no problem and even adds some charm to the adventure — just bring a raincoat. In heavy rain, a thunderstorm or a storm warning, we’ll move the trip to another date.'
        5:
            question: 'What should I bring?'
            answer: 'We recommend bringing:'
            list:
                1: 'A change of clothes and shoes'
                2: 'A hat and sunglasses'
                3: 'Sunscreen and insect repellent'
                4: 'Drinking water and snacks'
                5: 'Your phone in a waterproof case'
            download: 'Download the full list'
        6:
            question: 'Do you organise corporate trips?'
            answer: 'Yes, for groups of any size. We’ll put together a programme to suit you: meals, entertainment, team games and team building on the water. Get in touch to discuss the details.'
        7:
            question: 'How safe is it?'
            answer: 'Safety is our priority. Every trip starts with a briefing, everyone gets a life jacket, and our instructors know the route. We choose calm rivers without difficult rapids.'
about:
    title: 'About us'
    eyebrow: Chöven
    meta_description: 'The story of the Chöven team: how a passion for paddling became river trips on the most beautiful rivers of Belarus. Photos and contacts.'
    history:
        title: 'Our story'
        p1: 'It all started with a simple love of paddling. Our first rivers were the Isloch, the Viliya and the Narochanka. Our love for the river and the nature around it gradually grew into something more.'
        p2: 'In 2022 we bought our first kayaks and spent the whole season taking friends and acquaintances out on the water. Seeing the growing interest in active holidays on the water, we decided to expand our small fleet.'
        p3: 'By 2023 we were regularly running trips for anyone who wanted to join, and in 2024 our hobby became a proper business — and so Chöven was born.'
        quote: 'Our main goal hasn’t changed — to share our love of paddling and give you unforgettable experiences in nature.'
        p4: 'Today we offer a range of routes and formats — from short day trips to multi-day expeditions with nights on the riverbank.'
        p5: 'Our team is always exploring new rivers to show you the most beautiful and exciting corners of Belarusian nature.'
