info:
    title: 'Усё пра сплавы'
    eyebrow: 'Перад паездкай'
    subtitle: 'Правілы бяспекі, як праходзіць дзень на вадзе і адказы на частыя пытанні.'
    meta_description: 'Тэхніка бяспекі на сплаве, як праходзіць сплаў на байдарках і адказы на частыя пытанні: што ўзяць з сабой, ці можна з дзецьмі, што рабіць у дождж.'
    safety:
        title: 'Тэхніка бяспекі'
        life_jacket:
            title: 'Ратавальная камізэлька — абавязкова!'
            text: 'Незалежна ад вопыту і ўмення плаваць, заўсёды апранайце камізэльку. Непрадбачаныя кульбіты бываюць ва ўсіх.'
        sober:
            title: 'Свята — пасля вяртання на бераг'
            text: 'Цвярозаму прасцей справіцца з цяжкасцямі ў дарозе і даплыць да канца.'
        not_alone:
            title: 'Не сплаўляйцеся ў адзіночку'
            text: 'Трымайце ў полі зроку папярэднюю лодку: у непрадбачанай сітуацыі вы дапаможаце адно аднаму або паклічаце на дапамогу.'
        oars:
            title: 'Вёслы — каб веславаць'
            text: 'Адштурхоўвацца вёсламі ад дна і берагоў амаль бескарысна — значна больш эфектыўна веславаць. Да таго ж вёслы каштуюць грошай.'
        trees:
            title: 'Абдымайце сябра, а не дрэва'
            text: 'Большасць перакульванняў здараецца, калі веславальшчыкі хапаюцца за галіны, а рака з гэтым не згодная.'
        posture:
            title: 'Спіна роўна'
            text: 'Працуе плечавы пояс. Калі пры веславанні вы адхіляецеся ўбок — нешта ідзе не так.'
    tips:
        title: 'Дадатковыя рэкамендацыі'
        dry_bag: 'Вазьміце непрамакальны чахол для тэлефона і дакументаў'
        spare_clothes: 'Складзіце запасную вопратку ў воданепранікальны мяшок'
        sun: 'Карыстайцеся абаронай ад сонца: крэм, галаўны ўбор, акуляры'
        instructor: 'Выконвайце ўказанні інструктара і не адрывайцеся ад групы'
        enjoy: 'Атрымлівайце асалоду ад цішыні і прыгажосці беларускай прыроды'
    process:
        title: 'Як праходзіць сплаў'
        step: 'Крок %number%'
        1:
            title: 'Сустрэча і інструктаж'
            text: 'Сустракаемся ў прызначаным месцы, знаёмімся і праводзім падрабязны інструктаж. Вы атрымліваеце ўвесь рыштунак для бяспечнага сплаву.'
            points:
                1: 'Навучанне тэхніцы веславання'
                2: 'Выдача рыштунку'
                3: 'Інструктаж па бяспецы'
        2:
            title: 'Старт на вадзе'
            text: 'Спускаем байдаркі на ваду, рассаджваемся і пачынаем прыгоду. Не адразу, але ўсё атрымаецца — вось убачыце!'
            points:
                1: 'Спуск байдарак на ваду'
                2: 'Практыка тэхнікі веславання'
                3: 'Першыя кусты за першым паваротам'
        3:
            title: 'Актыўны сплаў'
            text: 'Рухаемся па рацэ, атрымліваючы асалоду ад прыроды і цішыні. Фатаграфуем, размаўляем і адпачываем, цалкам пагружаючыся ў атмасферу прыгоды.'
            points:
                1: 'Пераадоленне перашкод'
                2: 'Камандная праца ў экіпажы'
                3: 'Цішыня і краявіды, дзеля якіх варта ехаць'
        4:
            title: 'Прывал і адпачынак'
            text: 'У сярэдзіне маршруту робім прыпынак: час перакусіць і адпачыць.'
            points:
                1: 'Адпачынак на беразе'
                2: 'Перакус і першыя ўражанні'
                3: 'Купанне ў чыстай рацэ'
        5:
            title: 'Фініш і вяртанне'
            text: 'Прыбываем на фініш. Адпачынак, ежа, лазня і гульні ля вогнішча — у праграмах з начоўкай.'
            points:
                1: 'Прыбыццё ў канчатковы пункт'
                2: 'Адчуванне перамогі'
                3: 'Песні ля вогнішча'
    promo:
        title: 'Гатовыя да прыгоды?'
        text: 'Забраніруйце сплаў зараз — без перадаплаты, мы ператэлефануем і ўсё ўзгоднім.'
    faq:
        title: 'Частыя пытанні'
        1:
            question: 'Ці патрэбны вопыт для ўдзелу ў сплаве?'
            answer: 'Не. Інструктары праводзяць падрабязны інструктаж перад стартам і вучаць усяму неабходнаму. Большасць маршрутаў падыходзяць для пачаткоўцаў — галоўнае жаданне і выкананне інструкцый.'
        2:
            question: 'Што ўваходзіць у кошт сплаву?'
            answer: 'У базавы кошт уваходзіць арэнда байдаркі, вёслаў, ратавальных камізэлек і гермамяшкоў. Харчаванне, намёты, трансфер, паслугі інструктара і рыштунак для начоўкі залежаць ад абранага пакета — удакладняйце пры браніраванні.'
        3:
            question: 'Ці можна на сплаў з дзецьмі?'
            answer: 'Так, дзеці ўдзельнічаюць у суправаджэнні дарослых. Мы выдаём ратавальныя камізэлькі адпаведнага памеру і падкажам маршруты, якія лепш за ўсё падыходзяць для сямейнага адпачынку.'
        4:
            question: 'Што рабіць, калі пойдзе дождж?'
            answer: 'Лёгкі дождж не перашкода і нават дадае прыгодзе шарму — вазьміце дажджавік. Пры моцным дажджы, навальніцы або штармавым папярэджанні перанясём сплаў на іншую дату.'
        5:
            question: 'Што ўзяць з сабой?'
            answer: 'Рэкамендуем узяць:'
            list:
                1: 'Запасную вопратку і абутак'
                2: 'Галаўны ўбор і сонцаахоўныя акуляры'
                3: 'Крэм ад сонца і сродак ад насякомых'
                4: 'Пітную ваду і перакус'
                5: 'Тэлефон у воданепранікальным чахле'
            download: 'Спампаваць поўны спіс'
        6:
            question: 'Арганізуеце карпаратыўныя сплавы?'
            answer: 'Так, для груп любой колькасці. Складзём праграму пад вашы пажаданні: харчаванне, забавы, камандныя гульні і цімбілдынг на вадзе. Звяжыцеся з намі, каб абмеркаваць дэталі.'
        7:
            question: 'Наколькі гэта бяспечна?'
            answer: 'Бяспека — наш прыярытэт. Перад кожным сплавам праводзіцца інструктаж, выдаюцца ратавальныя камізэлькі, інструктары ведаюць маршрут. Мы выбіраем спакойныя рэкі без складаных парогаў.'
about:
    title: 'Пра нас'
    eyebrow: Чöвен
    meta_description: 'Гісторыя каманды Чöвен: як захапленне водным турызмам ператварылася ў сплавы па самых прыгожых рэках Беларусі. Фотаздымкі і кантакты.'
    history:
        title: 'Наша гісторыя'
        p1: 'Усё пачалося з простага захаплення водным турызмам. Першымі рэкамі былі Іслач, Вілія і Нарачанка. Любоў да ракі і прыроды вакол паступова перарасла ў нешта большае.'
        p2: 'У 2022 годзе мы купілі першыя каякі і ўвесь сезон каталі сяброў і знаёмых. Бачачы, як расце цікавасць да актыўнага адпачынку на вадзе, мы вырашылі пашырыць наш невялікі флот.'
