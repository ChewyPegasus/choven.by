        quote: 'Наша галоўная мэта нязменная — падзяліцца любоўю да воднага турызму і падарыць вам незабыўныя ўражанні ад сустрэчы з прыродай.'
        p4: 'Сёння мы прапануем розныя маршруты і фарматы — ад кароткіх аднадзённых прагулак да шматдзённых экспедыцый з начоўкамі на беразе.'
