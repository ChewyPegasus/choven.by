info:
    title: 'Всё о сплавах'
    eyebrow: 'Перед поездкой'
    subtitle: 'Правила безопасности, как проходит день на воде и ответы на частые вопросы.'
    meta_description: 'Техника безопасности на сплаве, как проходит сплав на байдарках и ответы на частые вопросы: что взять с собой, можно ли с детьми, что делать в дождь.'
    safety:
        title: 'Техника безопасности'
        life_jacket:
            title: 'Спасательный жилет — обязательно!'
            text: 'Независимо от опыта и умения плавать, всегда надевайте жилет. Непредвиденные кульбиты бывают у всех.'
        sober:
            title: 'Праздник — после возвращения на берег'
            text: 'Трезвым проще справиться с трудностями на пути и доплыть до конца.'
        not_alone:
            title: 'Не сплавляйтесь в одиночку'
            text: 'Держите в поле зрения предыдущую лодку: в непредвиденной ситуации вы поможете друг другу или позовёте на помощь.'
        oars:
            title: 'Вёсла — чтобы грести'
            text: 'Отталкиваться вёслами от дна и берегов почти бесполезно — гораздо эффективнее грести. К тому же вёсла стоят денег.'
        trees:
            title: 'Обнимайте друга, а не дерево'
            text: 'Большинство переворотов случается, когда гребцы хватаются за ветки, а река с этим не согласна.'
        posture:
            title: 'Спина ровно'
            text: 'Работает плечевой пояс. Если при гребке вы отклоняетесь в сторону — что-то идёт не так.'
    tips:
        title: 'Дополнительные рекомендации'
        dry_bag: 'Возьмите непромокаемый чехол для телефона и документов'
        spare_clothes: 'Сложите сменную одежду в водонепроницаемый мешок'
        sun: 'Используйте защиту от солнца: крем, головной убор, очки'
        instructor: 'Следуйте указаниям инструктора и не отрывайтесь от группы'
        enjoy: 'Наслаждайтесь тишиной и красотой белорусской природы'
    process:
        title: 'Как проходит сплав'
        step: 'Шаг %number%'
        1:
            title: 'Встреча и инструктаж'
            text: 'Встречаемся в назначенном месте, знакомимся и проводим подробный инструктаж. Вы получаете всё снаряжение для безопасного сплава.'
            points:
                1: 'Обучение технике гребли'
                2: 'Выдача снаряжения'
                3: 'Инструктаж по безопасности'
        2:
            title: 'Старт на воде'
            text: 'Спускаем байдарки на воду, рассаживаемся и начинаем приключение. Не сразу, но всё получится — вот увидите!'
            points:
                1: 'Спуск байдарок на воду'
                2: 'Практика техники гребли'
                3: 'Первые кусты за первым поворотом'
        3:
            title: 'Активный сплав'
            text: 'Движемся по реке, наслаждаясь природой и тишиной. Фотографируем, общаемся и отдыхаем, полностью погружаясь в атмосферу приключения.'
            points:
                1: 'Преодоление препятствий'
                2: 'Командная работа в экипаже'
                3: 'Тишина и виды, ради которых стоит ехать'
        4:
            title: 'Привал и отдых'
            text: 'В середине маршрута делаем остановку: время перекусить и отдохнуть.'
            points:
                1: 'Отдых на берегу'
                2: 'Перекус и первые впечатления'
                3: 'Купание в чистой реке'
        5:
            title: 'Финиш и возвращение'
            text: 'Прибываем на финиш. Отдых, еда, баня и игры у костра — в программах с ночёвкой.'
            points:
                1: 'Прибытие в конечную точку'
                2: 'Ощущение победы'
                3: 'Песни у костра'
    promo:
        title: 'Готовы к приключению?'
        text: 'Забронируйте сплав сейчас — без предоплаты, мы перезвоним и всё согласуем.'
    faq:
        title: 'Частые вопросы'
        1:
            question: 'Нужен ли опыт для участия в сплаве?'
            answer: 'Нет. Инструкторы проводят подробный инструктаж перед стартом и учат всему необходимому. Большинство маршрутов подходят для новичков — главное желание и соблюдение инструкций.'
        2:
            question: 'Что входит в стоимость сплава?'
            answer: 'В базовую стоимость входит аренда байдарки, вёсел, спасательных жилетов и гермомешков. Питание, палатки, трансфер, услуги инструктора и снаряжение для ночёвки зависят от выбранного пакета — уточняйте при бронировании.'
        3:
            question: 'Можно ли на сплав с детьми?'
            answer: 'Да, дети участвуют в сопровождении взрослых. Мы выдаём спасательные жилеты подходящего размера и подскажем маршруты, которые лучше всего подходят для семейного отдыха.'
        4:
            question: 'Что делать, если пойдёт дождь?'
            answer: 'Лёгкий дождь не помеха и даже добавляет приключению шарма — возьмите дождевик. При сильном дожде, грозе или штормовом предупреждении перенесём сплав на другую дату.'
        5:
            question: 'Что взять с собой?'
            answer: 'Рекомендуем взять:'
            list:
                1: 'Сменную одежду и обувь'
                2: 'Головной убор и солнцезащитные очки'
                3: 'Крем от солнца и средство от насекомых'
                4: 'Питьевую воду и перекус'
                5: 'Телефон в водонепроницаемом чехле'
            download: 'Скачать полный список'
        6:
            question: 'Организуете корпоративные сплавы?'
            answer: 'Да, для групп любого размера. Составим программу под ваши пожелания: питание, развлечения, командные игры и тимбилдинг на воде. Свяжитесь с нами, чтобы обсудить детали.'
        7:
            question: 'Насколько это безопасно?'
            answer: 'Безопасность — наш приоритет. Перед каждым сплавом проводится инструктаж, выдаются спасательные жилеты, инструкторы знают маршрут. Мы выбираем спокойные реки без сложных порогов.'
about:
    title: 'О нас'
    eyebrow: Чöвен
    meta_description: 'История команды Чöвен: как увлечение водным туризмом превратилось в сплавы по самым красивым рекам Беларуси. Фотографии и контакты.'
    history:
        title: 'Наша история'
        p1: 'Всё началось с простого увлечения водным туризмом. Первыми реками были Ислочь, Вилия и Нарочанка. Любовь к реке и природе вокруг постепенно переросла в нечто большее.'
        p2: 'В 2022 году мы купили первые каяки и весь сезон катали друзей и знакомых. Видя растущий интерес к активному отдыху на воде, мы решили расширить наш небольшой флот.'
        p3: 'К 2023 году мы уже регулярно организовывали сплавы для всех желающих, а в 2024 году увлечение превратилось в полноценное дело — так родился «Чöвен».'
        quote: 'Наша главная цель неизменна — поделиться любовью к водному туризму и подарить вам незабываемые впечатления от встречи с природой.'
        p4: 'Сегодня мы предлагаем разные маршруты и форматы — от коротких однодневных прогулок до многодневных экспедиций с ночёвками на берегу.'
        p5: 'Команда постоянно исследует новые реки, чтобы показать вам самые красивые и захватывающие уголки белорусской природы.'
    gallery:
        title: Фотогалерея
        empty: 'Фотографии скоро появятся.'
