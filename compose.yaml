# Development environment: `make up` (or `docker compose up -d --build`), then open http://localhost:8080
# Production: see compose.prod.yaml and README.md.

x-php-env: &php-env
    APP_ENV: ${APP_ENV:-dev}
    DATABASE_URL: postgresql://${POSTGRES_USER:-choven}:${POSTGRES_PASSWORD:-choven}@database:5432/${POSTGRES_DB:-choven}?serverVersion=16&charset=utf8
    REDIS_URL: redis://redis:6379
    SESSION_DSN: redis://redis:6379
    LOCK_DSN: redis://redis:6379
    MAILER_DSN: ${MAILER_DSN:-smtp://mailer:1025}
    MESSENGER_TRANSPORT_DSN: doctrine://default?auto_setup=0
    DEFAULT_URI: ${DEFAULT_URI:-http://localhost:8080}
    TRUSTED_PROXIES: private_ranges
    XDEBUG_MODE: ${XDEBUG_MODE:-off}

services:
    php:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
            target: php_dev
        image: choven-php-dev
        restart: unless-stopped
        environment: *php-env
        volumes:
            - .:/app
            # Keep the container's cache out of the bind mount: faster, and no clashes with a PHP installed on the host.
            - php_cache:/app/var/cache
        depends_on:
            database:
                condition: service_healthy
            redis:
                condition: service_healthy
        extra_hosts:
            - host.docker.internal:host-gateway

    # Sends queued emails and runs scheduled jobs (completing past trips, cleanup).
    worker:
        image: choven-php-dev
        restart: unless-stopped
        environment: *php-env
        volumes:
            - .:/app
            - php_cache:/app/var/cache
        command: ["php", "bin/console", "messenger:consume", "async", "scheduler_default", "--time-limit=3600", "--memory-limit=192M", "-v"]
        healthcheck:
            disable: true
        depends_on:
            php:
                condition: service_healthy

    nginx:
        image: nginx:1.27-alpine
        restart: unless-stopped
        ports:
            - "${HTTP_PORT:-8080}:80"
        volumes:
            - ./public:/app/public:ro
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on:
            php:
                condition: service_healthy

    database:
        image: postgres:16-alpine
        restart: unless-stopped
        environment:
            POSTGRES_DB: ${POSTGRES_DB:-choven}
            POSTGRES_USER: ${POSTGRES_USER:-choven}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-choven}
        healthcheck:
            test: ["CMD", "pg_isready", "-d", "${POSTGRES_DB:-choven}", "-U", "${POSTGRES_USER:-choven}"]
            interval: 5s
            timeout: 5s
            retries: 10
        volumes:
            - database_data:/var/lib/postgresql/data
        ports:
            - "${POSTGRES_PORT:-5432}:5432"

    redis:
        image: redis:7-alpine
        restart: unless-stopped
        command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 3s
            retries: 10
        volumes:
            - redis_data:/data
        ports:
            - "${REDIS_PORT:-6379}:6379"

    # Catches every email sent in development: http://localhost:8025
    mailer:
        image: axllent/mailpit:latest
        restart: unless-stopped
        environment:
            MP_SMTP_AUTH_ACCEPT_ANY: 1
            MP_SMTP_AUTH_ALLOW_INSECURE: 1
        ports:
            - "1025:1025"
            - "8025:8025"

volumes:
    database_data:
    redis_data:
    php_cache:
