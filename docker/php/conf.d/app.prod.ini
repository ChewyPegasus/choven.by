; Production (FrankenPHP worker mode): the kernel stays in memory between requests, preloading still speeds up
; worker (re)starts after FRANKENPHP_LOOP_MAX requests. Source files are never re-checked.
; preload_user only matters when PHP runs as root (the image runs as www-data).
opcache.preload_user = www-data
opcache.preload = /app/config/preload.php
opcache.validate_timestamps = 0
; JIT brings little for a typical Symfony request and is the least battle-tested part of OPcache under ZTS.
opcache.jit = disable
opcache.jit_buffer_size = 0
display_errors = Off
log_errors = On
