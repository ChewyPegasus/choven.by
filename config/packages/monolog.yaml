monolog:
    channels:
        - deprecation # Deprecations are logged in the dedicated "deprecation" channel when it exists

when@dev:
    monolog:
        handlers:
            main:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug
                channels: ["!event"]
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine", "!console"]

when@test:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ["!event"]
            nested:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug

when@prod:
    monolog:
        handlers:
            # Everything from INFO up goes to the container output (docker logs) as JSON...
            stderr:
                type: fingers_crossed
                action_level: error
                handler: stderr_nested
                excluded_http_codes: [404, 405]
                buffer_size: 50
            stderr_nested:
                type: stream
                path: php://stderr
                level: info
                formatter: monolog.formatter.json
            # ...and warnings are also kept in a rotating file shown in Admin → Logs.
            file:
                type: rotating_file
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: warning
                max_files: 14
                channels: ["!deprecation"]
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine"]
            # Errors (including uncaught exceptions) go to Sentry / GlitchTip when SENTRY_DSN is set.
            sentry:
                type: service
                id: Sentry\Monolog\Handler
                channels: ["!deprecation", "!event"]
