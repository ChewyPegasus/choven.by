framework:
    asset_mapper:
        paths:
            - assets/
        excluded_patterns:
            - '*/assets/files/**/*.md'
        missing_import_mode: strict

when@prod:
    framework:
        asset_mapper:
            missing_import_mode: warn
            # asset-map:compile also writes .br/.zst/.gz next to text assets; Caddy (docker/frankenphp/Caddyfile)
            # sends them as they are. Formats are those the system supports (the prod image has the brotli and
            # zstd extensions, gzip is always available).
            precompress: true
