framework:
    cache:
        prefix_seed: choven/app
        # Filesystem cache locally; Redis in production (shared by all PHP containers).
        app: cache.adapter.filesystem
        system: cache.adapter.system
        pools:
            # Worker heartbeat read by /health/worker (shared between the web and the worker processes).
            monitoring.cache:
                adapter: cache.app

when@prod:
    framework:
        cache:
            app: cache.adapter.redis
            default_redis_provider: '%env(REDIS_URL)%'
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system

when@test:
    framework:
        cache:
            # Tests roll back the database after each test; a persistent cache would leak state between them.
            app: cache.adapter.array
            pools:
                # Must survive between requests of a test (the array cache is reset); tests clear it.
                monitoring.cache:
                    adapter: cache.adapter.filesystem
