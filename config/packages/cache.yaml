framework:
    cache:
        prefix_seed: choven/app
        # Filesystem cache locally; Redis in production (shared by all PHP containers).
        app: cache.adapter.filesystem
        system: cache.adapter.system

when@prod:
    framework:
        cache:
            app: cache.adapter.redis
            default_redis_provider: '%env(REDIS_URL)%'
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system

when@test:
    framework:
        cache:
            # Tests roll back the database after each test; a persistent cache would leak state between them.
            app: cache.adapter.array
