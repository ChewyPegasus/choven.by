security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            id: App\Security\UserProvider

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|uploads|build)/
            security: false
        main:
            lazy: true
            provider: app_user_provider
            user_checker: App\Security\UserChecker
            form_login:
                login_path: app_login
                check_path: app_login
                username_parameter: identifier
                password_parameter: password
                enable_csrf: true
                csrf_token_id: authenticate
                default_target_path: app_profile_orders
                use_referer: true
            two_factor:
                auth_form_path: 2fa_login
                check_path: 2fa_login_check
                default_target_path: app_profile_orders
                enable_csrf: true
                csrf_token_id: two_factor
                trusted_parameter_name: _trusted
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'
            logout:
                path: app_logout
                target: app_main
                enable_csrf: true
                csrf_token_id: logout
            remember_me:
                secret: '%kernel.secret%'
                lifetime: 2592000 # 30 days
                path: /
                samesite: lax
                signature_properties: ['password', 'email']

    role_hierarchy:
        ROLE_ADMIN: ROLE_USER

    # Controllers also carry #[IsGranted] attributes; this is a second line of defence.
    access_control:
        # The code page is reachable only between the password and the second factor.
        - { path: '^/(ru|be|en)/2fa', roles: IS_AUTHENTICATED_2FA_IN_PROGRESS }
        - { path: '^/(ru|be|en)/admin', roles: ROLE_ADMIN }
        - { path: '^/(ru|be|en)/profile', roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            # Fast (insecure) hashing in tests.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
