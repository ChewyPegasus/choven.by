framework:
    messenger:
        failure_transport: failed

        transports:
            # Emails and background jobs. Consumed by: bin/console messenger:consume async scheduler_default
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                retry_strategy:
                    max_retries: 5
                    delay: 60000        # 1 min, then 3, 9, 27, 60 min
                    multiplier: 3
                    max_delay: 3600000
            # Messages that failed all retries; visible in Admin → Emails.
            failed: 'doctrine://default?queue_name=failed&auto_setup=0'
            # Handled immediately; used by `app:jobs:run`.
            sync: 'sync://'

        routing:
            Symfony\Component\Mailer\Messenger\SendEmailMessage: async
            App\Message\SendTelegramMessage: async
            App\Message\SendViberMessage: async
            App\Message\CheckWaitlist: async
            App\Message\GenerateImageVariants: async

