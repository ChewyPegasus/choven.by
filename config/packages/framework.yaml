# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'
    trusted_proxies: '%env(TRUSTED_PROXIES)%'
    trusted_headers: ['x-forwarded-for', 'x-forwarded-host', 'x-forwarded-proto', 'x-forwarded-port', 'x-forwarded-prefix']

    # Sessions start only when something is written to them (login, flash message, CSRF token),
    # so anonymous visitors of public pages never create one.
    session:
        handler_id: '%env(resolve:SESSION_DSN)%'
        cookie_secure: auto
        cookie_samesite: lax
        cookie_lifetime: 0
        gc_maxlifetime: 86400

    http_method_override: false
    handle_all_throwables: true

    php_errors:
        log: true

    rate_limiter:
        # Public forms; keyed by client IP.
        booking:
            policy: sliding_window
            limit: 5
            interval: '15 minutes'
        contact:
            policy: sliding_window
            limit: 5
            interval: '1 hour'
        registration:
            policy: sliding_window
            limit: 5
            interval: '1 hour'
        verification:
            policy: sliding_window
            limit: 3
            interval: '1 hour'

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
