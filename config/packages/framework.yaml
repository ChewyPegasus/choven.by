# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'
    # nginx (docker/nginx/default.conf) appends the real client IP to X-Forwarded-For; only private networks
    # (nginx itself, a reverse proxy on the same host) are trusted, so spoofed values from clients are ignored.
    trusted_proxies: '%env(TRUSTED_PROXIES)%'
    trusted_headers: ['x-forwarded-for', 'x-forwarded-proto', 'x-forwarded-port']
    # Requests with any other Host header are rejected (protects links in emails). Empty = any host (development).
    trusted_hosts: '%env(TRUSTED_HOSTS)%'

    # Sessions start only when something is written to them (login, flash message, CSRF token),
    # so anonymous visitors of public pages never create one.
    session:
        handler_id: '%env(resolve:SESSION_DSN)%'
        cookie_secure: auto
        cookie_samesite: lax
        cookie_lifetime: 0
        gc_maxlifetime: 86400

    http_method_override: false
    handle_all_throwables: true

    php_errors:
        log: true

    rate_limiter:
        # Public forms; keyed by client IP.
        booking:
            policy: sliding_window
            limit: 5
            interval: '15 minutes'
        contact:
            policy: sliding_window
            limit: 5
            interval: '1 hour'
        registration:
            policy: sliding_window
            limit: 10
            interval: '1 hour'
        verification:
            policy: sliding_window
            limit: 3
            interval: '1 hour'
        # Checking promo / gift codes from the booking form (stops guessing codes).
        promo:
            policy: sliding_window
            limit: 20
            interval: '10 minutes'
        gift:
            policy: sliding_window
            limit: 5
            interval: '1 hour'

when@test:
    services:
        App\Tests\Support\RecordingHttpClient: ~
    framework:
        test: true
        http_client:
            mock_response_factory: App\Tests\Support\RecordingHttpClient
        session:
            storage_factory_id: session.storage.factory.mock_file
