# Application services. Bundles are configured in config/packages/.
parameters:
    app.locales: !php/const App\Model\Localized::LOCALES
    app.locales_regex: 'ru|be|en'

    # Defaults for App\Service\SiteSettings; administrators override them in Admin → Settings.
    app.settings_defaults:
        phone: '%env(CONTACT_PHONE)%'
        email: '%env(CONTACT_EMAIL)%'
        instagram: '%env(default::CONTACT_INSTAGRAM)%'
        telegram: '%env(default::CONTACT_TELEGRAM)%'
        notification_email: '%env(default::ADMIN_EMAIL)%'
        daily_capacity: '%env(int:BOOKING_DAILY_CAPACITY)%'
        booking_enabled: true
        blocked_dates: []
        announcement: []
        yandex_metrika_id: ~
        google_analytics_id: ~
        # Online prepayment: share of the price in % (0 = no prepayment), whether the booking waits for it,
        # and after how many hours an unpaid booking is cancelled.
        prepayment_percent: 0
        prepayment_required: false
        prepayment_hold_hours: 24
        # Free cancellation (with refund of the prepayment) and online rescheduling up to N days before the trip.
        free_change_days: 3
        gift_certificates_enabled: true
        # Administrators must set up two-factor authentication before using the admin panel.
        admin_2fa_required: false

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Enum/'
            - '../src/Message/'
            - '../src/Exception/'
            - '../src/Model/'
            - '../src/Kernel.php'
            # Value objects and gateways built by App\Payment\PaymentGateways.
            - '../src/Payment/{CheckoutRequest,PaymentResult,PaymentException,BePaidGateway,DemoGateway}.php'
