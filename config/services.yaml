# Application services. Bundles are configured in config/packages/.
parameters:
    app.locales: !php/const App\Model\Localized::LOCALES
    app.locales_regex: 'ru|be|en'

    # Defaults for App\Service\SiteSettings; administrators override them in Admin → Settings.
    app.settings_defaults:
        phone: '%env(CONTACT_PHONE)%'
        email: '%env(CONTACT_EMAIL)%'
        instagram: '%env(default::CONTACT_INSTAGRAM)%'
        telegram: '%env(default::CONTACT_TELEGRAM)%'
        notification_email: '%env(default::ADMIN_EMAIL)%'
        daily_capacity: '%env(int:BOOKING_DAILY_CAPACITY)%'
        booking_enabled: true
        blocked_dates: []
        announcement: []

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Enum/'
            - '../src/Message/'
            - '../src/Model/'
            - '../src/Kernel.php'
